<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LanguageTool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <script type="importmap">
      { "imports": { "da-lit": "https://da.live/nx2/deps/lit/dist/index.js" } }
    </script>
    <link rel="stylesheet" href="https://da.live/nx2/styles/styles.css">
    <link rel="stylesheet" href="https://da.live/nx2/styles/buttons.css">
    <link rel="stylesheet" href="https://da.live/nx2/styles/form.css">
    <link rel="stylesheet" href="https://da.live/nx2/styles/spinner.css">
    <link rel="stylesheet" href="./languagetool.css">
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <script src="./languagetool.js" type="module"></script>
  </head>
  <body>
    <main id="app" class="lt">
      <h1 class="lt-vh">LanguageTool</h1>

      <section class="lt-head">
        <div class="lt-title">
          <div id="server-row" class="lt-row">
            <p>Checks go to <strong id="server-name">…</strong></p>
          </div>
          <span id="menu-slot"></span>
        </div>
        <div id="problem" class="lt-warn" hidden></div>
      </section>

      <section class="lt-check">
        <div id="check-row" class="lt-row">
          <button type="button" id="check-page" class="nx-form-btn-primary" disabled>Check page</button>
          <button type="button" id="check-selection" class="nx-form-btn-secondary" disabled>Check selection</button>
        </div>
        <div id="notice" class="lt-callout" hidden>
          <p id="notice-text"></p>
          <div class="lt-row">
            <button type="button" id="notice-ok" class="nx-form-btn-primary">Continue</button>
            <button type="button" id="notice-cancel" class="nx-form-btn-secondary">Cancel</button>
          </div>
        </div>
        <p id="status" class="lt-status" role="status">Loading…</p>
      </section>

      <form id="key-form" class="lt-key" hidden>
        <div id="key-title" class="lt-row">
          <h2>Premium key</h2>
        </div>
        <label class="nx-form-field">LanguageTool login email
          <input id="lt-user" class="nx-input" type="email" autocomplete="off" required>
        </label>
        <label class="nx-form-field">API key
          <input id="lt-key" class="nx-input" type="password" autocomplete="off" spellcheck="false" required>
        </label>
        <div class="lt-row">
          <button type="submit" id="key-save" class="nx-form-btn-primary">Save key</button>
          <button type="button" id="key-cancel" class="nx-form-btn-secondary">Cancel</button>
          <a href="https://languagetool.org/editor/settings/access-tokens" target="_blank" rel="noopener">Get an API key</a>
        </div>
      </form>

      <section id="results" hidden aria-labelledby="results-title">
        <div id="results-row" class="lt-row">
          <h2 id="results-title" tabindex="-1"></h2>
        </div>
        <p id="results-meta" class="lt-meta"></p>
        <ul id="counts" class="lt-counts"></ul>
        <div id="apply-bar" class="lt-apply" hidden>
          <p id="preview" class="lt-preview"></p>
          <button type="button" id="apply" class="nx-form-btn-primary">Apply fixes</button>
        </div>
        <div id="groups"></div>
        <p id="assistant-row" hidden>
          <button type="button" id="assistant" class="nx-form-btn-secondary">Ask the assistant to fix these</button>
        </p>
      </section>

      <footer class="lt-credit">
        Powered by <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool</a>
      </footer>
    </main>
  </body>
</html>
